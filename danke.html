<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vielen Dank!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
            overflow: hidden;
        }

        /* =========================
           KONFETTI
        ========================= */

        #confetti-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .confetti {
            position: absolute;
            top: -30px;

            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;

            border-radius: 2px;
        }

        /*
         * Animation pausieren
         */
        #confetti-container.paused .confetti {
            animation-play-state: paused;
        }

        @keyframes fall {

            0% {
                transform:
                    translateY(-30px)
                    translateX(0)
                    rotate(0deg);
            }

            25% {
                transform:
                    translateY(25vh)
                    translateX(35px)
                    rotate(90deg);
            }

            50% {
                transform:
                    translateY(50vh)
                    translateX(-35px)
                    rotate(180deg);
            }

            75% {
                transform:
                    translateY(75vh)
                    translateX(30px)
                    rotate(270deg);
            }

            100% {
                transform:
                    translateY(110vh)
                    translateX(-20px)
                    rotate(360deg);
            }
        }


        /* =========================
           HAUPTINHALT
        ========================= */

        .page {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 550px;

            padding: 50px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 18px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.12);
        }


        /* =========================
           CHECK ICON
        ========================= */

        .check {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #222;
            color: #fff;

            font-size: 42px;
        }


        /* =========================
           TEXT
        ========================= */

        h1 {
            margin: 0 0 15px;

            font-size: 32px;
        }

        p {
            margin: 0 auto 30px;

            color: #666;

            line-height: 1.6;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        button {
            width: 100%;

            padding: 14px 20px;

            border: none;
            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }


        .back-button {
            background: #222;
            color: #fff;
        }

        .back-button:hover {
            background: #444;
        }


        .pause-button {
            background: #e9ecef;
            color: #222;
        }

        .pause-button:hover {
            background: #ddd;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 27px;
            }

            .check {
                width: 70px;
                height: 70px;

                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         KONFETTI-CONTAINER
    ========================================== -->

    <div id="confetti-container"></div>


    <!-- =========================================
         HAUPTINHALT
    ========================================== -->

    <main class="page">

        <div class="card">

            <div class="check">
                ✓
            </div>

            <h1>Vielen Dank!</h1>

            <p>
                Ihre Angaben wurden erfolgreich übermittelt.
                Vielen Dank für Ihre Anmeldung.
            </p>

            <div class="buttons">

                <button
                    type="button"
                    class="back-button"
                    id="backButton"
                >
                    Zurück
                </button>

                <button
                    type="button"
                    class="pause-button"
                    id="pauseButton"
                >
                    ⏸ Konfetti pausieren
                </button>

            </div>

        </div>

    </main>


    <script>

        /* =========================================
           EINSTELLUNGEN
        ========================================== */

        /*
         * HIER DIE ZIELSEITE EINTRAGEN
         *
         * Beispiel:
         * https://www.example.com/
         *
         * oder:
         * index.html
         */

        const ZURUECK_URL ="index.html";


        /*
         * Anzahl der Konfetti-Elemente
         */

        const CONFETTI_ANZAHL = 120;


        /*
         * Verfügbare Konfetti-Farben
         */

        const CONFETTI_FARBEN = [
            "#ff595e",
            "#ffca3a",
            "#8ac926",
            "#1982c4",
            "#6a4c93",
            "#ff7b00",
            "#00b4d8"
        ];


        /* =========================================
           KONFETTI ERSTELLEN
        ========================================== */

        const confettiContainer =
            document.getElementById("confetti-container");


        function createConfetti() {

            for (let i = 0; i < CONFETTI_ANZAHL; i++) {

                const confetti =
                    document.createElement("div");

                confetti.className = "confetti";


                /*
                 * Zufällige horizontale Position
                 */

                confetti.style.left =
                    Math.random() * 100 + "%";


                /*
                 * Zufällige Größe
                 */

                const breite =
                    Math.random() * 7 + 5;

                const hoehe =
                    Math.random() * 12 + 10;

                confetti.style.width =
                    breite + "px";

                confetti.style.height =
                    hoehe + "px";


                /*
                 * Zufällige Farbe
                 */

                const farbe =
                    CONFETTI_FARBEN[
                        Math.floor(
                            Math.random() *
                            CONFETTI_FARBEN.length
                        )
                    ];

                confetti.style.backgroundColor = farbe;


                /*
                 * Zufällige Fallgeschwindigkeit
                 */

                const dauer =
                    Math.random() * 4 + 4;

                confetti.style.animationDuration =
                    dauer + "s";


                /*
                 * Zufälliger Startzeitpunkt
                 *
                 * Das Minus sorgt dafür,
                 * dass beim Laden bereits überall
                 * Konfetti unterwegs ist.
                 */

                const verzögerung =
                    Math.random() * 6;

                confetti.style.animationDelay =
                    "-" + verzögerung + "s";


                /*
                 * Zufällige Rotation
                 */

                confetti.style.transform =
                    "rotate(" +
                    Math.random() * 360 +
                    "deg)";


                confettiContainer.appendChild(confetti);
            }
        }


        createConfetti();


        /* =========================================
           PAUSE / FORTSETZEN
        ========================================== */

        const pauseButton =
            document.getElementById("pauseButton");

        let pausiert = false;


        pauseButton.addEventListener("click", function () {

            pausiert = !pausiert;


            if (pausiert) {

                confettiContainer.classList.add("paused");

                pauseButton.textContent =
                    "▶ Konfetti fortsetzen";

            } else {

                confettiContainer.classList.remove("paused");

                pauseButton.textContent =
                    "⏸ Konfetti pausieren";
            }

        });


        /* =========================================
           ZURÜCK-BUTTON
        ========================================== */

        const backButton =
            document.getElementById("backButton");


        backButton.addEventListener("click", function () {

            window.location.href = ZURUECK_URL;

        });

    </script>

</body>
</html>

Die einzige Stelle, die du zwingend anpassen musst, ist:

const ZURUECK_URL = "https://www.example.com/";

Dort kannst du z. B. auch einfach

const ZURUECK_URL = "index.html";

eintragen.
